<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot CEPER - Assistente de Perícias</title>
    <!-- Font Awesome (ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1a33 0%, #1a2f4f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 32px 28px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 20px;
        }

        .header-icon {
            background: #1e88e5;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.3);
        }

        .header h1 {
            color: #fff;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.3px;
        }

        .header h1 span {
            color: #64b5f6;
            font-weight: 300;
        }

        .header .badge {
            background: rgba(255, 255, 255, 0.08);
            color: #aac9f0;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            margin-left: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-area {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            padding: 16px 18px;
            min-height: 200px;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #1e88e5;
            border-radius: 8px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b0c4de;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #1e88e5;
            color: #fff;
        }

        .message .bubble {
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 18px;
            border-radius: 18px;
            color: #e8edf5;
            font-size: 15px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .message.user .bubble {
            background: #1e88e5;
            color: #fff;
            border: none;
        }

        .message .bubble code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #b0d4ff;
        }

        .message .bubble strong {
            color: #ffd966;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #90a4ae;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 1.2s infinite;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); }
            30% { opacity: 1; transform: scale(1); }
        }

        .input-area {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 6px 6px 18px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border 0.2s;
        }
        .input-area:focus-within {
            border-color: #1e88e5;
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            padding: 12px 0;
            outline: none;
        }
        .input-area input::placeholder {
            color: #78909c;
            font-weight: 300;
        }

        .input-area button {
            background: #1e88e5;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover {
            background: #1565c0;
            transform: scale(1.02);
        }
        .input-area button:active {
            transform: scale(0.97);
        }
        .input-area button i {
            font-size: 16px;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            color: #546e7a;
            font-size: 12px;
            padding: 0 4px;
        }
        .footer a {
            color: #64b5f6;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .header h1 { font-size: 20px; }
            .input-area { flex-wrap: wrap; padding: 12px; gap: 10px; border-radius: 24px; }
            .input-area input { width: 100%; padding: 10px 0; }
            .input-area button { width: 100%; justify-content: center; padding: 14px; }
            .message .bubble { max-width: 95%; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-icon"><i class="fas fa-gavel"></i></div>
        <h1>CEPER <span>Bot</span></h1>
        <span class="badge"><i class="fas fa-brain" style="margin-right: 4px;"></i> IA</span>
    </div>

    <!-- Área de mensagens -->
    <div id="chatArea" class="chat-area">
        <!-- Mensagem de boas-vindas -->
        <div class="message assistant">
            <div class="avatar"><i class="fas fa-robot"></i></div>
            <div class="bubble">
                👋 Olá! Sou o assistente da CEPER.<br />
                Pergunte sobre <strong>procedimentos, certidões, prazos</strong> ou qualquer rotina da Central de Perícias.
            </div>
        </div>
        <!-- Indicador de digitação (escondido) -->
        <div id="typing" class="typing-indicator">
            <div class="avatar" style="width:36px;height:36px;border-radius:50%;background:#1e293b;display:flex;align-items:center;justify-content:center;color:#b0c4de;font-size:16px;">
                <i class="fas fa-robot"></i>
            </div>
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Entrada de texto -->
    <div class="input-area">
        <input id="userInput" type="text" placeholder="Digite sua dúvida sobre a CEPER..." />
        <button id="sendBtn"><i class="fas fa-paper-plane"></i> Enviar</button>
    </div>

    <div class="footer">
        <span><i class="fas fa-lock" style="margin-right: 4px;"></i> Chave API segura no backend</span>
        <span>v1.0 · <i class="fas fa-database"></i> Base CEPER</span>
    </div>
</div>

<script>
    (function() {
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');
        let isProcessing = false;

        // Rola para o final
        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Adiciona mensagem ao chat
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = role === 'user'
                ? '<i class="fas fa-user"></i>'
                : '<i class="fas fa-robot"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            // Interpreta quebras de linha
            bubble.innerHTML = text.replace(/\n/g, '<br />');

            div.appendChild(avatar);
            div.appendChild(bubble);
            chatArea.appendChild(div);
            scrollToBottom();
        }

        // Mostra/esconde o indicador de digitação
        function setTyping(visible) {
            typing.style.display = visible ? 'flex' : 'none';
            if (visible) scrollToBottom();
        }

        // Envia pergunta
        async function sendQuestion() {
            if (isProcessing) return;
            const question = userInput.value.trim();
            if (!question) {
                userInput.focus();
                return;
            }

            // Bloqueia enquanto processa
            isProcessing = true;
            sendBtn.disabled = true;
            userInput.disabled = true;

            // Mostra pergunta do usuário
            addMessage('user', question);
            userInput.value = '';
            setTyping(true);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                setTyping(false);

                if (!response.ok) {
                    let errorMsg = 'Erro ao processar sua pergunta.';
                    try {
                        const errData = await response.json();
                        if (errData.error) errorMsg = errData.error;
                    } catch (_) { /* ignore */ }
                    addMessage('assistant', `❌ ${errorMsg}`);
                    return;
                }

                const data = await response.json();

                // Se a resposta tiver erro (ex: saldo insuficiente)
                if (data.error) {
                    addMessage('assistant', `⚠️ ${data.error}`);
                    return;
                }

                if (data.answer) {
                    addMessage('assistant', data.answer);
                } else {
                    addMessage('assistant', '🤔 Não consegui gerar uma resposta. Tente reformular sua pergunta.');
                }

            } catch (err) {
                setTyping(false);
                addMessage('assistant', `❌ Erro de conexão: ${err.message || 'tente novamente mais tarde.'}`);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        // Eventos
        sendBtn.addEventListener('click', sendQuestion);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });

        // Foco inicial
        userInput.focus();
    })();
</script>
</body>
</html>
