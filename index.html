<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CEPER Bot - Supabase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        /* ========================================
           RESET E VARIÁVEIS (MANTIDO IGUAL)
        ======================================== */
        /* (coloque aqui o CSS completo da versão anterior – vou omitir para não estourar) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a3a5c;
            --primary-light: #2a5a8c;
            --secondary: #e8b931;
            --bg-dark: #0e1a2b;
            --bg-card: rgba(255,255,255,0.05);
            --text-light: #e8edf5;
            --text-muted: #a0b8d0;
            --border-color: rgba(255,255,255,0.08);
            --shadow: 0 15px 40px rgba(0,0,0,0.4);
            --radius: 20px;
            --transition: 0.3s ease;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; background-image: radial-gradient(circle at 10% 20%, rgba(26,58,92,0.3) 0%, transparent 60%); }
        .container { max-width: 1100px; width: 100%; background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--radius); padding: 28px 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow); margin-top: 10px; }
        /* ... (todo o CSS permanece igual ao da última versão) ... */
        /* Importante: mantenha todo o CSS que você já tem – vou enviar completo no final */
    </style>
</head>
<body>

    <!-- ============================================
    TELA DE LOGIN (igual)
    ============================================ -->
    <div id="telaLogin">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> Acesso restrito</h2>
            <input type="email" id="loginEmail" placeholder="E-mail" />
            <input type="password" id="loginSenha" placeholder="Senha" />
            <button onclick="fazerLogin()">Entrar</button>
            <div class="erro" id="erroLogin">Usuário ou senha inválidos.</div>
            <div class="info">Acesso exclusivo para servidores da CEPER.</div>
            <div class="online-login" id="onlineLoginContainer">
                <h4><i class="fas fa-circle" style="color:var(--success);font-size:10px;"></i> Usuários online agora</h4>
                <ul id="onlineLoginList">
                    <li class="empty-online">Carregando...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- ============================================
    TELA DE TROCA DE SENHA
    ============================================ -->
    <div id="telaTrocaSenha">
        <div class="login-box">
            <h2><i class="fas fa-key"></i> Trocar senha</h2>
            <p>Esta é a sua primeira vez. Defina uma nova senha para continuar.</p>
            <input type="password" id="novaSenha" placeholder="Nova senha (mínimo 6 caracteres)" />
            <input type="password" id="confirmarSenha" placeholder="Confirmar nova senha" />
            <button onclick="trocarSenhaPrimeiroAcesso()">Salvar nova senha</button>
            <div class="erro" id="erroTrocaSenha">As senhas não coincidem ou são muito curtas.</div>
        </div>
    </div>

    <!-- ============================================
    CONTEÚDO PRINCIPAL
    ============================================ -->
    <div id="conteudoPrincipal" class="container" style="display:none;">
        <!-- HEADER, TABS, CHAT IA, AVISOS, BASE, CHAT INTERNO, USUÁRIOS (mantido igual) -->
        <!-- ... (mantenha todo o HTML exatamente como estava) ... -->
    </div>

    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://jxcioqwwxsnyhmkigvbj.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_ezQwOFDaLoXUlhDjwvLMWw_9xsxEc8U';

        // ============================================
        // FUNÇÕES DE API (idênticas)
        // ============================================
        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        };
        async function apiGet(table, filters) {
            const url = SUPABASE_URL + table + (filters ? '?' + filters : '');
            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiPost(table, data) {
            const res = await fetch(SUPABASE_URL + table, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(await res.text());
            const text = await res.text();
            return text ? JSON.parse(text) : {};
        }
        async function apiPatch(table, id, data) {
            const res = await fetch(SUPABASE_URL + table + '?id=eq.' + id, {
                method: 'PATCH',
                headers: headers,
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(await res.text());
            const text = await res.text();
            return text ? JSON.parse(text) : {};
        }
        async function apiDelete(table, id) {
            const res = await fetch(SUPABASE_URL + table + '?id=eq.' + id, {
                method: 'DELETE',
                headers: headers
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        // ============================================
        // ÁUDIO (criado no primeiro clique)
        // ============================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { /* silencioso */ }
            }
        }

        function playNotificationSound() {
            if (!audioCtx) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.25);
            } catch (e) { /* silencioso */ }
        }

        // Inicializa áudio no primeiro clique
        document.addEventListener('click', initAudio, { once: true });

        // ============================================
        // VARIÁVEIS GLOBAIS
        // ============================================
        let usuarioAtual = null;
        let lastMessageCount = 0;
        let chatInterval = null;
        let ultimaMensagemLida = 0;
        let onlineInterval = null;
        let logoutTimer = null;
        const LOGOUT_TIMEOUT = 30 * 60 * 1000; // 30 minutos
        const BUSY_TIMEOUT = 10 * 60 * 1000;   // 10 minutos

        // ============================================
        // ONLINE USERS (com status busy)
        // ============================================
        async function carregarOnlineUsers() {
            try {
                const usuarios = await apiGet('usuarios', 'select=nome,ultima_atividade&order=ultima_atividade.desc');
                const agora = new Date();
                const doisMinutos = 2 * 60 * 1000;
                const online = usuarios.filter(u => {
                    if (!u.ultima_atividade) return false;
                    const diff = agora - new Date(u.ultima_atividade);
                    return diff < doisMinutos;
                });
                // Usuários busy (entre 10 e 30 min de inatividade)
                const busy = usuarios.filter(u => {
                    if (!u.ultima_atividade) return false;
                    const diff = agora - new Date(u.ultima_atividade);
                    return diff >= BUSY_TIMEOUT && diff < LOGOUT_TIMEOUT;
                });

                // Lista de online na tela de login
                const loginList = document.getElementById('onlineLoginList');
                if (loginList) {
                    if (online.length === 0 && busy.length === 0) {
                        loginList.innerHTML = '<li class="empty-online">Ninguém online no momento.</li>';
                    } else {
                        let html = '';
                        online.forEach(u => {
                            html += `<li><span class="dot"></span> ${u.nome}</li>`;
                        });
                        busy.forEach(u => {
                            html += `<li><span class="dot" style="background:var(--secondary);"></span> ${u.nome} (ocupado)</li>`;
                        });
                        loginList.innerHTML = html;
                    }
                }

                // Lista no chat e seletor de destinatário
                const chatList = document.getElementById('onlineUsersList');
                if (chatList) {
                    if (online.length === 0 && busy.length === 0) {
                        chatList.innerHTML = '<li class="empty-online">Ninguém online no momento.</li>';
                    } else {
                        let html = '';
                        online.forEach(u => {
                            html += `<li><span class="online-dot"></span> ${u.nome}</li>`;
                        });
                        busy.forEach(u => {
                            html += `<li><span class="online-dot" style="background:var(--secondary);"></span> ${u.nome} (ocupado)</li>`;
                        });
                        chatList.innerHTML = html;
                    }
                }

                // Atualiza seletor de destinatário (apenas online, não busy)
                const selectDest = document.getElementById('chatDestinatario');
                if (selectDest) {
                    const currentVal = selectDest.value;
                    selectDest.innerHTML = '<option value="todos">Todos (público)</option>';
                    const usuarioLogado = JSON.parse(localStorage.getItem('usuario') || '{}');
                    online.forEach(u => {
                        if (u.nome !== usuarioLogado.nome) {
                            const opt = document.createElement('option');
                            opt.value = u.nome;
                            opt.textContent = u.nome;
                            selectDest.appendChild(opt);
                        }
                    });
                    // Adiciona busy também? Não, apenas online para chat.
                    // Mas se quiser incluir busy, descomente:
                    // busy.forEach(u => { ... });
                    if ([...selectDest.options].some(o => o.value === currentVal)) {
                        selectDest.value = currentVal;
                    }
                }
            } catch (err) {
                console.error('Erro ao carregar online:', err);
            }
        }

        // ============================================
        // ATUALIZAR ATIVIDADE DO USUÁRIO
        // ============================================
        async function atualizarAtividade() {
            const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
            if (!usuario.id) return;
            try {
                await apiPatch('usuarios', usuario.id, {
                    ultima_atividade: new Date().toISOString()
                });
            } catch (e) { /* ignorar */ }
        }

        // ============================================
        // VERIFICAR INATIVIDADE E LOGOUT AUTOMÁTICO
        // ============================================
        function verificarInatividade() {
            const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
            if (!usuario.id || !usuario.ultima_atividade) return;
            const agora = new Date();
            const diff = agora - new Date(usuario.ultima_atividade);
            if (diff > LOGOUT_TIMEOUT) {
                // Logout automático
                logout();
                alert('Sessão expirada por inatividade. Faça login novamente.');
            }
        }

        // ============================================
        // EVENTOS DE INTERAÇÃO (atualizam atividade)
        // ============================================
        function setupInteractionListeners() {
            const events = ['click', 'mousemove', 'keydown', 'scroll', 'touchstart'];
            events.forEach(evt => {
                document.addEventListener(evt, function() {
                    if (localStorage.getItem('logado') === 'true') {
                        atualizarAtividade();
                    }
                }, { passive: true });
            });
        }

        // ============================================
        // LOGIN E TROCA DE SENHA
        // ============================================
        async function fazerLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;
            const erro = document.getElementById('erroLogin');
            if (!email || !senha) {
                erro.textContent = 'Preencha e-mail e senha.';
                erro.style.display = 'block';
                return;
            }
            try {
                const usuarios = await apiGet('usuarios', 'email=eq.' + encodeURIComponent(email));
                if (!usuarios || usuarios.length === 0) {
                    erro.textContent = 'Usuário não encontrado.';
                    erro.style.display = 'block';
                    return;
                }
                const usuario = usuarios[0];
                const hashDigitado = CryptoJS.SHA256(senha).toString();
                if (hashDigitado !== usuario.senha_hash) {
                    erro.textContent = 'Senha incorreta.';
                    erro.style.display = 'block';
                    return;
                }
                if (!usuario.ativo) {
                    erro.textContent = 'Usuário desativado.';
                    erro.style.display = 'block';
                    return;
                }
                usuarioAtual = usuario;
                localStorage.setItem('usuario', JSON.stringify(usuario));
                localStorage.setItem('logado', 'true');
                if (usuario.primeiro_acesso) {
                    document.getElementById('telaLogin').style.display = 'none';
                    document.getElementById('telaTrocaSenha').style.display = 'flex';
                    return;
                }
                entrarSistema(usuario);
            } catch (err) {
                erro.textContent = 'Erro de conexão: ' + err.message;
                erro.style.display = 'block';
            }
        }

        async function trocarSenhaPrimeiroAcesso() {
            const nova = document.getElementById('novaSenha').value;
            const confirmar = document.getElementById('confirmarSenha').value;
            const erro = document.getElementById('erroTrocaSenha');
            if (nova.length < 6) {
                erro.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                erro.style.display = 'block';
                return;
            }
            if (nova !== confirmar) {
                erro.textContent = 'As senhas não coincidem.';
                erro.style.display = 'block';
                return;
            }
            const hash = CryptoJS.SHA256(nova).toString();
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            try {
                await apiPatch('usuarios', usuario.id, {
                    senha_hash: hash,
                    primeiro_acesso: false
                });
                usuario.senha_hash = hash;
                usuario.primeiro_acesso = false;
                localStorage.setItem('usuario', JSON.stringify(usuario));
                document.getElementById('telaTrocaSenha').style.display = 'none';
                entrarSistema(usuario);
            } catch (err) {
                erro.textContent = 'Erro ao trocar senha: ' + err.message;
                erro.style.display = 'block';
            }
        }

        function entrarSistema(usuario) {
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('telaTrocaSenha').style.display = 'none';
            document.getElementById('conteudoPrincipal').style.display = 'block';
            document.getElementById('infoUsuario').textContent = '👤 ' + usuario.nome;
            document.getElementById('chatUsuarioNome').textContent = usuario.nome;
            // Atualiza atividade imediatamente
            atualizarAtividade();
            if (usuario.papel === 'super_admin') {
                document.getElementById('tabUsuariosBtn').classList.remove('hidden-tab');
                carregarUsuarios();
            } else {
                document.getElementById('tabUsuariosBtn').classList.add('hidden-tab');
            }
            carregarAvisos();
            carregarProcedimentos();
            carregarChatInterno();
            atualizarBadgeAvisos();
            startChatPolling();
            startOnlinePolling();
            // Verifica inatividade a cada 30 segundos
            if (logoutTimer) clearInterval(logoutTimer);
            logoutTimer = setInterval(verificarInatividade, 30000);
            // Configura listeners de interação
            setupInteractionListeners();
        }

        function logout() {
            localStorage.removeItem('usuario');
            localStorage.removeItem('logado');
            if (chatInterval) clearInterval(chatInterval);
            if (onlineInterval) clearInterval(onlineInterval);
            if (logoutTimer) clearInterval(logoutTimer);
            window.location.reload();
        }

        // Verificar sessão
        if (localStorage.getItem('logado') === 'true') {
            const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
            if (usuario.id) {
                if (usuario.primeiro_acesso) {
                    document.getElementById('telaLogin').style.display = 'none';
                    document.getElementById('telaTrocaSenha').style.display = 'flex';
                } else {
                    document.getElementById('telaLogin').style.display = 'none';
                    document.getElementById('conteudoPrincipal').style.display = 'block';
                    document.getElementById('infoUsuario').textContent = '👤 ' + usuario.nome;
                    document.getElementById('chatUsuarioNome').textContent = usuario.nome;
                    if (usuario.papel === 'super_admin') {
                        document.getElementById('tabUsuariosBtn').classList.remove('hidden-tab');
                        carregarUsuarios();
                    } else {
                        document.getElementById('tabUsuariosBtn').classList.add('hidden-tab');
                    }
                    carregarAvisos();
                    carregarProcedimentos();
                    carregarChatInterno();
                    atualizarBadgeAvisos();
                    startChatPolling();
                    startOnlinePolling();
                    logoutTimer = setInterval(verificarInatividade, 30000);
                    setupInteractionListeners();
                }
            } else {
                localStorage.removeItem('logado');
                localStorage.removeItem('usuario');
            }
        }

        // ============================================
        // ONLINE POLLING
        // ============================================
        function startOnlinePolling() {
            if (onlineInterval) clearInterval(onlineInterval);
            carregarOnlineUsers();
            onlineInterval = setInterval(carregarOnlineUsers, 10000);
        }

        // ============================================
        // AVISOS, PROCEDIMENTOS, CHAT INTERNO (idênticos à versão anterior)
        // ============================================
        // (mantenha todo o restante do código igual – vou omitir para não estourar)
        // Inclua todas as funções: carregarAvisos, carregarProcedimentos, carregarChatInterno, etc.

        // ============================================
        // NAVEGAÇÃO POR ABAS (idêntico)
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                    const target = document.getElementById(this.dataset.tab);
                    if (target) target.classList.add('active');
                    if (this.dataset.tab === 'tabChatInterno') carregarChatInterno();
                });
            });
            if (!localStorage.getItem('logado')) {
                carregarOnlineUsers();
                setInterval(carregarOnlineUsers, 10000);
            }
        });
    </script>
</body>
</html>
